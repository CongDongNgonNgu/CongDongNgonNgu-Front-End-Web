<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1e4165" />
    <title>Đang ngoại tuyến | Cộng đồng ngôn ngữ</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", system-ui, sans-serif; background: #f4f6f2; color: #18324c; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; box-sizing: border-box; }
      main { width: min(100%, 34rem); padding: 2rem; background: #fbfcf9; border: 1px solid #d7ded8; border-radius: 0.75rem; box-shadow: 0 8px 24px rgba(24, 50, 76, 0.1); }
      h1 { margin: 0 0 0.75rem; font-size: clamp(1.5rem, 6vw, 2.25rem); line-height: 1.15; }
      p { line-height: 1.55; }
      a { display: inline-block; margin-top: 0.75rem; padding: 0.75rem 1rem; border-radius: 0.5rem; background: #1e4165; color: #fff; text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 3px solid #d96e28; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p aria-hidden="true">Cộng đồng ngôn ngữ</p>
      <h1>Bạn đang ngoại tuyến</h1>
      <p>Nội dung công khai đã lưu có thể mở lại khi sẵn sàng. Các thao tác đăng nhập, cộng đồng, AI và thanh toán cần kết nối mạng.</p>
      <a href="/">Thử lại trang chủ</a>
    </main>
  </body>
</html>
