name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate read-only SSH preflight
        run: bash -n scripts/deploy/ssh-preflight.sh && shellcheck scripts/deploy/ssh-preflight.sh

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Performance budget
        run: npm run performance:check

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

  production-preflight:
    needs: quality
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate read-only SSH preflight
        run: bash -n scripts/deploy/ssh-preflight.sh && shellcheck scripts/deploy/ssh-preflight.sh
      - name: Inspect existing production SSH and deployment prerequisites
        env:
          CDNN_SSH_PRIVATE_KEY: ${{ secrets.CDNN_SSH_PRIVATE_KEY }}
          CDNN_KNOWN_HOSTS: ${{ secrets.CDNN_KNOWN_HOSTS }}
          CDNN_SSH_HOST: ${{ secrets.CDNN_SSH_HOST }}
          CDNN_SSH_USER: ${{ secrets.CDNN_SSH_USER }}
        run: bash scripts/deploy/ssh-preflight.sh
