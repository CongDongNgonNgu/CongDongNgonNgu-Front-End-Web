name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deployment shell validation
        run: bash -n scripts/deploy/transport.sh && bash -n scripts/deploy/release.sh && shellcheck scripts/deploy/*.sh

      - name: Deployment safety tests
        run: node --test scripts/deploy/*.node-spec.cjs

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Performance budget
        run: npm run performance:check

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

  production:
    needs: quality
    if: ${{ false && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/production.yml
    permissions:
      contents: read
